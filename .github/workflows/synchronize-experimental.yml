name: synchronize main to experimental

on:
  workflow_dispatch:
    inputs:
      finalize-pr:
        description: Recover post-merge finalization for one synchronization pull request
        required: false
        type: string
  workflow_run:
    workflows:
      - build
    types:
      - completed
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: synchronize-main-to-experimental
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    name: prepare current synchronization pull request
    if: >-
      github.repository == 'seed4j/seed4j-cli' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main') ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        inputs['finalize-pr'] == ''))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      SYNC_BRANCH: automation/sync-main-to-experimental
      SYNC_ISSUE_TITLE: '[synchronization] main to experimental conflict'
      SYNC_PENDING_LABEL: synchronization-pending
    steps:
      - name: 'Setup: checkout trusted synchronization code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: main

      - name: 'Synchronize: verify exact successful current main'
        id: source
        env:
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main experimental
          CURRENT_MAIN_SHA="$(git rev-parse origin/main)"
          SOURCE_SHA="${BUILD_SHA:-$CURRENT_MAIN_SHA}"
          if [ "$SOURCE_SHA" != "$CURRENT_MAIN_SHA" ]; then
            echo "Ignoring stale successful main build ${SOURCE_SHA}; current main is ${CURRENT_MAIN_SHA}."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            SUCCESSFUL_BUILD_COUNT="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow github-actions.yml --branch main --commit "$SOURCE_SHA" --event push --status success --limit 1 --json databaseId --jq 'length')"
            if [ "$SUCCESSFUL_BUILD_COUNT" != "1" ]; then
              echo "Current main ${SOURCE_SHA} has no successful push build; waiting for the standard build." >&2
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: 'Synchronize: verify durable pending label'
        if: steps.source.outputs.eligible == 'true'
        run: |
          LABELS_PATH="$RUNNER_TEMP/synchronization-labels.json"
          gh label list --repo "$GITHUB_REPOSITORY" --search "$SYNC_PENDING_LABEL" --limit 100 --json name > "$LABELS_PATH"
          MATCHING_LABELS="$(jq --arg label "$SYNC_PENDING_LABEL" '[.[] | select(.name == $label)] | length' "$LABELS_PATH")"
          if [ "$MATCHING_LABELS" != '1' ]; then
            echo "Required repository label '${SYNC_PENDING_LABEL}' is absent. A maintainer must create it before synchronization can run." >&2
            exit 1
          fi

      - name: 'Synchronize: prepare disposable branch from current experimental'
        id: proposal
        if: steps.source.outputs.eligible == 'true'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          ADAPTER_OUTPUT="$RUNNER_TEMP/synchronization-preparation-output"
          for attempt in 1 2 3; do
            git fetch origin main experimental
            CURRENT_MAIN_SHA="$(git rev-parse origin/main)"
            TARGET_SHA="$(git rev-parse origin/experimental)"
            PROPOSAL_HEAD_SHA=''
            if git merge-base --is-ancestor "$SOURCE_SHA" "$TARGET_SHA"; then
              MERGE_RESULT=already-contained
            else
              git switch -C "$SYNC_BRANCH" "origin/experimental"
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              if git merge --no-ff --no-edit "$SOURCE_SHA"; then
                MERGE_RESULT=clean
                PROPOSAL_HEAD_SHA="$(git rev-parse HEAD)"
              else
                git merge --abort
                MERGE_RESULT=conflict
              fi
            fi
            git fetch origin main experimental
            CURRENT_MAIN_SHA="$(git rev-parse origin/main)"
            CURRENT_EXPERIMENTAL_SHA="$(git rev-parse origin/experimental)"
            export CURRENT_EXPERIMENTAL_SHA CURRENT_MAIN_SHA MERGE_RESULT PROPOSAL_HEAD_SHA
            export PROPOSAL_SOURCE_SHA="$SOURCE_SHA" PROPOSAL_TARGET_SHA="$TARGET_SHA"
            export BUILD_CONCLUSION=success BUILD_EVENT=push BUILD_HEAD_BRANCH=main BUILT_SHA="$SOURCE_SHA"
            : > "$ADAPTER_OUTPUT"
            GITHUB_OUTPUT="$ADAPTER_OUTPUT" node scripts/main-to-experimental-sync.cjs prepare-workflow
            ACTION="$(sed -n 's/^action=//p' "$ADAPTER_OUTPUT")"
            if [ "$ACTION" = 'refresh' ]; then
              continue
            fi
            cat "$ADAPTER_OUTPUT" >> "$GITHUB_OUTPUT"
            exit 0
          done
          echo "Experimental moved during every bounded preparation attempt; a later run must refresh it." >&2
          exit 1

      - name: 'Synchronize: create or update the conflict issue'
        if: steps.proposal.outputs.action == 'report-conflict'
        env:
          SOURCE_SHA: ${{ steps.proposal.outputs.source }}
          TARGET_SHA: ${{ steps.proposal.outputs.target }}
        run: |
          ISSUE_BODY="$(printf '@renanfranca automatic one-way synchronization stopped because Git could not merge current main `%s` into current experimental `%s`. Both protected branches are unchanged. Resolve the conflict in a reviewed pull request, then refresh synchronization.\n\nWorkflow run: %s/%s/actions/runs/%s' "$SOURCE_SHA" "$TARGET_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          SYNC_ISSUES_PATH="$RUNNER_TEMP/synchronization-conflict-issues.json"
          ISSUE_OUTPUT="$RUNNER_TEMP/synchronization-conflict-issue-output"
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --label synchronization-failure --limit 100 --json number,title > "$SYNC_ISSUES_PATH"
          export SYNC_CONFLICT=true SYNC_ISSUES_PATH
          GITHUB_OUTPUT="$ISSUE_OUTPUT" node scripts/main-to-experimental-sync.cjs issue-workflow
          ISSUE_ACTION="$(sed -n 's/^action=//p' "$ISSUE_OUTPUT")"
          ISSUE_NUMBER="$(sed -n 's/^issue=//p' "$ISSUE_OUTPUT")"
          if [ "$ISSUE_ACTION" = 'update' ]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-assignee renanfranca --add-label synchronization-failure --body "$ISSUE_BODY" --title "$SYNC_ISSUE_TITLE"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --assignee renanfranca --label synchronization-failure --body "$ISSUE_BODY" --title "$SYNC_ISSUE_TITLE"
          fi

      - name: 'Synchronize: publish proposal and dispatch exact-head tests'
        if: steps.proposal.outputs.action == 'propose'
        env:
          PROPOSAL_HEAD_SHA: ${{ steps.proposal.outputs.head }}
          SOURCE_SHA: ${{ steps.proposal.outputs.source }}
          TARGET_SHA: ${{ steps.proposal.outputs.target }}
        run: |
          git fetch origin main experimental
          if [ "$(git rev-parse origin/main)" != "$SOURCE_SHA" ] || [ "$(git rev-parse origin/experimental)" != "$TARGET_SHA" ]; then
            gh workflow run synchronize-experimental.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "Source or target moved before proposal publication; dispatched a fresh synchronization run."
            exit 0
          fi
          REMOTE_SYNC_SHA="$(git ls-remote --heads origin "refs/heads/${SYNC_BRANCH}" | cut -f1)"
          if [ -n "$REMOTE_SYNC_SHA" ]; then
            git push --force-with-lease="refs/heads/${SYNC_BRANCH}:${REMOTE_SYNC_SHA}" origin "HEAD:refs/heads/${SYNC_BRANCH}"
          else
            git push origin "HEAD:refs/heads/${SYNC_BRANCH}"
          fi
          if [ "$(git ls-remote --heads origin "refs/heads/${SYNC_BRANCH}" | cut -f1)" != "$PROPOSAL_HEAD_SHA" ]; then
            echo "Remote synchronization branch does not match the prepared proposal head." >&2
            exit 1
          fi
          node scripts/main-to-experimental-sync.cjs pr-body > "$RUNNER_TEMP/synchronization-pr-body.md"
          mapfile -t PULL_REQUESTS < <(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base experimental --head "$SYNC_BRANCH" --limit 2 --json number --jq '.[].number')
          if [ "${#PULL_REQUESTS[@]}" -gt 1 ]; then
            echo "Expected at most one open synchronization pull request; found ${#PULL_REQUESTS[@]}." >&2
            exit 1
          fi
          if [ "${#PULL_REQUESTS[@]}" -eq 1 ]; then
            gh pr edit "${PULL_REQUESTS[0]}" --repo "$GITHUB_REPOSITORY" --add-label "$SYNC_PENDING_LABEL" --body-file "$RUNNER_TEMP/synchronization-pr-body.md" --title 'chore(sync): merge current main into experimental'
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base experimental --head "$SYNC_BRANCH" --label "$SYNC_PENDING_LABEL" --body-file "$RUNNER_TEMP/synchronization-pr-body.md" --title 'chore(sync): merge current main into experimental'
          fi
          gh workflow run github-actions.yml --repo "$GITHUB_REPOSITORY" --ref "$SYNC_BRANCH"
          SYNC_ISSUES_PATH="$RUNNER_TEMP/synchronization-resolved-issues.json"
          ISSUE_OUTPUT="$RUNNER_TEMP/synchronization-resolved-issue-output"
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --label synchronization-failure --limit 100 --json number,title > "$SYNC_ISSUES_PATH"
          export SYNC_CONFLICT=false SYNC_ISSUES_PATH
          GITHUB_OUTPUT="$ISSUE_OUTPUT" node scripts/main-to-experimental-sync.cjs issue-workflow
          if [ "$(sed -n 's/^action=//p' "$ISSUE_OUTPUT")" = 'close' ]; then
            ISSUE_NUMBER="$(sed -n 's/^issue=//p' "$ISSUE_OUTPUT")"
            gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "The current source and target now merge cleanly in synchronization pull request head ${PROPOSAL_HEAD_SHA}."
          fi

      - name: 'Synchronize: close resolved issue for an already-current target'
        if: steps.proposal.outputs.action == 'already-contained'
        run: |
          SYNC_ISSUES_PATH="$RUNNER_TEMP/synchronization-contained-issues.json"
          ISSUE_OUTPUT="$RUNNER_TEMP/synchronization-contained-issue-output"
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --label synchronization-failure --limit 100 --json number,title > "$SYNC_ISSUES_PATH"
          export SYNC_CONFLICT=false SYNC_ISSUES_PATH
          GITHUB_OUTPUT="$ISSUE_OUTPUT" node scripts/main-to-experimental-sync.cjs issue-workflow
          if [ "$(sed -n 's/^action=//p' "$ISSUE_OUTPUT")" = 'close' ]; then
            ISSUE_NUMBER="$(sed -n 's/^issue=//p' "$ISSUE_OUTPUT")"
            gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --comment 'Current experimental already contains the exact successful main revision.'
          fi
          gh workflow run github-actions.yml --repo "$GITHUB_REPOSITORY" --ref experimental

  finalize:
    name: finalize tested synchronization pull request
    if: >-
      github.repository == 'seed4j/seed4j-cli' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'automation/sync-main-to-experimental' &&
      github.event.workflow_run.actor.login == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      SYNC_BRANCH: automation/sync-main-to-experimental
      SYNC_PENDING_LABEL: synchronization-pending
    steps:
      - name: 'Setup: checkout trusted synchronization code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: main

      - name: 'Synchronize: review exact tests and current branches'
        id: review
        env:
          BUILD_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          BUILD_STATUS: ${{ github.event.workflow_run.status }}
          BUILT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main experimental "$SYNC_BRANCH"
          CURRENT_MAIN_SHA="$(git rev-parse origin/main)"
          CURRENT_EXPERIMENTAL_SHA="$(git rev-parse origin/experimental)"
          OBSERVED_PROPOSAL_HEAD_SHA="$(git rev-parse "origin/$SYNC_BRANCH")"
          PROPOSAL_PARENT_SHAS="$(git show -s --format=%P "$OBSERVED_PROPOSAL_HEAD_SHA")"
          SYNC_PULL_REQUESTS_PATH="$RUNNER_TEMP/synchronization-review-pull-requests.json"
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --base experimental --head "$SYNC_BRANCH" --limit 2 --json number,body,baseRefName,headRefName,headRefOid,mergeable,state,labels > "$SYNC_PULL_REQUESTS_PATH"
          export BUILD_CONCLUSION BUILD_STATUS BUILT_SHA CURRENT_EXPERIMENTAL_SHA CURRENT_MAIN_SHA OBSERVED_PROPOSAL_HEAD_SHA PROPOSAL_PARENT_SHAS SYNC_PENDING_LABEL SYNC_PULL_REQUESTS_PATH
          node scripts/main-to-experimental-sync.cjs review-workflow

      - name: 'Synchronize: refresh stale evidence'
        if: steps.review.outputs.action == 'refresh' || steps.review.outputs.action == 'report-conflict'
        env:
          REASON: ${{ steps.review.outputs.reason }}
        run: |
          echo "Synchronization evidence requires refresh: ${REASON}."
          gh workflow run synchronize-experimental.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: 'Synchronize: record pending or failed tests without merging'
        if: steps.review.outputs.action == 'wait' || steps.review.outputs.action == 'blocked'
        env:
          REASON: ${{ steps.review.outputs.reason }}
        run: echo "Synchronization pull request remains open without auto-merge because ${REASON}." >> "$GITHUB_STEP_SUMMARY"

      - name: 'Synchronize: enable auto-merge only for current green head'
        if: steps.review.outputs.action == 'enable-auto-merge'
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.review.outputs.source }}
          EXPECTED_TARGET_SHA: ${{ steps.review.outputs.target }}
          HEAD_SHA: ${{ steps.review.outputs.head }}
          PR_NUMBER: ${{ steps.review.outputs['pr-number'] }}
        run: |
          git fetch origin main experimental
          if [ "$(git rev-parse origin/main)" != "$EXPECTED_SOURCE_SHA" ] || [ "$(git rev-parse origin/experimental)" != "$EXPECTED_TARGET_SHA" ]; then
            gh workflow run synchronize-experimental.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo 'Source or target moved before auto-merge; dispatched a fresh synchronization run.'
            exit 0
          fi
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --merge --match-head-commit "$HEAD_SHA"

      - name: 'Synchronize: arrange durable post-merge finalization'
        if: steps.review.outputs.action == 'enable-auto-merge'
        env:
          PR_NUMBER: ${{ steps.review.outputs['pr-number'] }}
        run: |
          PR_STATE=OPEN
          for attempt in $(seq 1 12); do
            PR_STATE="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')"
            if [ "$PR_STATE" = "MERGED" ]; then
              break
            fi
            if [ "$attempt" != "12" ]; then
              sleep 5
            fi
          done
          gh workflow run synchronize-experimental.yml --repo "$GITHUB_REPOSITORY" --ref main -f finalize-pr="$PR_NUMBER"
          echo "Auto-merge state after bounded confirmation: ${PR_STATE}. Durable finalization was dispatched and the scheduled recovery remains active until merge completion." >> "$GITHUB_STEP_SUMMARY"

  recover-finalization:
    name: recover eventual synchronization merge
    if: >-
      github.repository == 'seed4j/seed4j-cli' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs['finalize-pr'] != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      SYNC_BRANCH: automation/sync-main-to-experimental
      SYNC_PENDING_LABEL: synchronization-pending
    steps:
      - name: 'Setup: checkout trusted synchronization code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: main

      - name: 'Synchronize: drain durable finalization state'
        env:
          REQUESTED_PR_NUMBER: ${{ inputs['finalize-pr'] }}
        run: node scripts/main-to-experimental-recovery.cjs
